name: TestFlight Daily

on:
  schedule:
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run daily scraper (new items, max 100)
        run: python3 scraper.py daily

      - name: Commit sent codes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_codes.json
          git diff --staged --quiet || git commit -m "Update sent codes [skip ci]"
          git push
