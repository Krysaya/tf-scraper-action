# ─────────────────────────────────────────
# Push Daily TF Links to TG
# → 读取 tf_daily_links_MMDD.json，去重后推送新增 TF 链接到 Telegram
# 时间：每天 UTC 21:10（北京时间 05:10）
# ─────────────────────────────────────────
name: Push Daily TF Links to TG

on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tg_push.py daily-tf
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_codes.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update TF sent codes [skip ci]"
          git push
