# ─────────────────────────────────────────
# Publish Weekly TF Collection to WeChat Drafts
# → 等 fetch-weekly-tf 完成后自动触发
# → 生成 TF 封面 + QR + HTML → 发 Cloudflare Worker → 草稿箱
# ─────────────────────────────────────────
name: Publish Weekly TF to WeChat

on:
  workflow_run:
    workflows: ["Fetch Weekly TF Links"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts (CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: pip install -r publishers/requirements.txt

      - name: Find latest TF weekly TXT
        id: find-txt
        run: |
          # 找最新的 TestFlight合集_第N期.txt（按数字排序，不用 ls -t 因为 git checkout 时间戳相同）
          FILE=$(ls -1v TestFlight合集_第*.txt 2>/dev/null | tail -1)
          if [ -z "$FILE" ]; then
            echo "❌ 找不到 TestFlight合集 TXT，跳过"
            exit 0
          fi
          echo "txt_file=$FILE" >> $GITHUB_OUTPUT
          echo "📄 文件: $FILE"

      - name: Generate content
        if: steps.find-txt.outputs.txt_file != ''
        run: python publishers/tf_weekly_publisher.py "${{ steps.find-txt.outputs.txt_file }}"

      - name: Commit generated content (for SCF to pick up)
        if: steps.find-txt.outputs.txt_file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Generate TF article content [skip ci]"
          git push
