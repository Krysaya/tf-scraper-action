name: Oodata Daily

on:
  schedule:
    - cron: '0 13 * * *'  # UTC 13:00 = 北京时间 21:00（比 TF 晚一小时）
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run oodata scraper
        run: python3 oodata_scraper.py

      - name: Commit sent IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oodata_sent.json
          git diff --staged --quiet || git commit -m "Update oodata sent [skip ci]"
          git push
