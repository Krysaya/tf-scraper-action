# ─────────────────────────────────────────
# Push Daily Free App to TG
# → 读取 每日限免MMDD.txt，推送摘要到 Telegram
# 时间：每天 UTC 01:05（北京时间 09:05）
# ─────────────────────────────────────────
name: Push Daily Free App to TG

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tg_push.py daily-free
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_free.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update free app sent records [skip ci]"
          git push
